<!-- component: Chip -->
<!-- Preview for the Seedling design system; see ../design-system.md and ./chip.md -->
<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chip: Seedling design system</title>
<style>
:root{
  --primary:#2e7d32;--success:#2e7d32;--info:#0288d1;--warning:#ed6c02;--error:#d32f2f;
  --warning-light:#ff9800;--error-light:#ef5350;
  --text:rgba(0,0,0,0.87);--text2:rgba(0,0,0,0.6);--text3:rgba(0,0,0,0.38);
  --divider:rgba(0,0,0,0.12);--rule:#e0e0e0;--paper:#fff;--chip:rgba(0,0,0,0.08);
}
*{box-sizing:border-box;}
html{-webkit-font-smoothing:antialiased;}
body{margin:0;font-family:Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:#fff;font-size:14px;line-height:1.43;letter-spacing:0.01071em;}
.mono{font-family:monospace;}
.page{max-width:980px;margin:0 auto;padding:40px 32px 80px;}
.ds-title{font-size:24px;font-weight:400;line-height:32px;margin:0 0 4px;}
.ds-sub{font-size:14px;color:var(--text2);margin:0 0 32px;}
.ds-section{margin-bottom:40px;}
.ds-h{font-size:16px;font-weight:600;line-height:28px;margin:0 0 8px;}
.ds-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;}
.ds-cell{display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
.ds-caption{font-size:12px;line-height:20px;letter-spacing:0.03333em;color:var(--text2);}
.chip{display:inline-flex;align-items:center;height:24px;border-radius:16px;font-size:13px;line-height:1.5;white-space:nowrap;}
.chip span{padding:0 8px;}
.chip.filled{color:#fff;} .chip.outlined{border:1px solid;}
.f-success{background:var(--success);} .f-info{background:var(--info);} .f-warning{background:var(--warning);} .f-error{background:var(--error);} .f-default{background:var(--chip);color:var(--text);}
.o-success{color:var(--success);border-color:rgba(46,125,50,.7);} .o-info{color:var(--info);border-color:rgba(2,136,209,.7);} .o-warning{color:var(--warning);border-color:rgba(237,108,2,.7);} .o-error{color:var(--error);border-color:rgba(211,47,47,.7);} .o-default{color:var(--text);border-color:#bdbdbd;} .o-primary{color:var(--primary);border-color:rgba(46,125,50,.7);}
.chip.mini{height:18px;font-size:0.65rem;} .chip.mini span{padding:0 6px;}
</style>
</head>
<body>
<div class="page">
<h1 class="ds-title">Chip</h1>
<p class="ds-sub">Small chips for state and attributes, in the status colours.</p>

<section class="ds-section">
<h2 class="ds-h">State, filled</h2>
<div class="ds-row">
  <span class="chip filled f-success"><span>running</span></span>
  <span class="chip filled f-info"><span>operating: gate migrate</span></span>
  <span class="chip filled f-warning"><span>degraded</span></span>
  <span class="chip filled f-error"><span>faulted</span></span>
  <span class="chip filled f-default"><span>not installed</span></span>
</div>
</section>

<section class="ds-section">
<h2 class="ds-h">Attributes and counts, outlined</h2>
<div class="ds-row">
  <span class="chip outlined o-error"><span>1 fault</span></span>
  <span class="chip outlined o-success"><span>high priority</span></span>
  <span class="chip outlined o-warning"><span>low priority</span></span>
  <span class="chip outlined o-info"><span>scheduled ×2</span></span>
  <span class="chip outlined o-default"><span>http</span></span>
  <span class="chip outlined o-primary"><span>pinned (2)</span></span>
</div>
</section>

<section class="ds-section">
<h2 class="ds-h">Mini</h2>
<div class="ds-row">
  <span class="chip mini outlined o-error"><span>Fault Filed</span></span>
  <span class="chip mini outlined o-info"><span>Gate State Changed</span></span>
  <span class="chip mini outlined o-warning"><span>stopped</span></span>
  <span class="chip mini outlined o-default"><span>http1</span></span>
</div>
</section>

</div>
</body>
</html>
