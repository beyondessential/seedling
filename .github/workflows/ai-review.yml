name: Review Hero
on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # A Dependabot-triggered run gets none of the repository secrets, so the
    # reusable workflow has nothing to authenticate with and fails at setup.
    if: github.actor != 'dependabot[bot]'
    uses: beyondessential/review-hero/.github/workflows/review.yml@v1
    secrets: inherit
