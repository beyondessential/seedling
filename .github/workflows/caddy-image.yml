name: Caddy image

on:
  pull_request:
    paths:
      - docker/caddy/**
      - etc/ci/check-caddy-image.sh
      - etc/ci/check-caddy-tag-unused.sh
      - .github/workflows/caddy-image.yml
  push:
    branches:
      - main
    paths:
      - docker/caddy/**
      - etc/ci/check-caddy-image.sh
      - etc/ci/check-caddy-tag-unused.sh
      - .github/workflows/caddy-image.yml
  workflow_dispatch:

concurrency:
  group: caddy-image-${{ github.ref }}
  cancel-in-progress: false

env:
  # Caddy version plus a build serial. Bump the serial when docker/caddy
  # changes without the Caddy version changing; the tag-moved job below fails a
  # pull request that forgets. Keep the Caddy part in sync with the FROM tags in
  # docker/caddy/Containerfile, and the whole tag in sync with CADDY_IMAGE in
  # crates/core/src/system/caddy/startup.rs.
  TAG: "2.11.4-1"
  IMAGE: ghcr.io/beyondessential/seedling-caddy

jobs:
  tag-moved:
    name: Tag moved
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: A Containerfile change must move the image tag to an unused serial
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Three dots, so this asks what the pull request changed rather than
          # how the two tips differ. Two dots also reports a Containerfile that
          # moved on the base branch and not here, which is a change the pull
          # request does not own and cannot bump a serial for.
          if git diff --quiet "$BASE...$HEAD" -- docker/caddy/Containerfile; then
            echo "Containerfile unchanged; nothing to check."
            exit 0
          fi

          read_tag() { sed -n 's/^ *TAG: *"\(.*\)"/\1/p' | head -n1; }
          old="$(git show "$BASE:.github/workflows/caddy-image.yml" | read_tag)"
          new="$(read_tag < .github/workflows/caddy-image.yml)"

          if [ "$old" = "$new" ]; then
            echo "::error::docker/caddy/Containerfile changed but TAG is still \"$new\". \
          A rebuilt image published under an existing tag leaves hosts on whichever \
          digest they already pulled. Bump the serial."
            exit 1
          fi
          echo "tag moved: $old -> $new"

          # Moving relative to the base branch does not see a serial another
          # build already claimed; only the registry knows that.
          etc/ci/check-caddy-tag-unused.sh "$IMAGE" "$new"

  build:
    name: Build and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4

      # Build the native arch first and check it before anything is published,
      # so a missing module fails here rather than on a host.
      - name: Build for checking
        uses: docker/build-push-action@v7.3.0
        with:
          context: docker/caddy
          file: docker/caddy/Containerfile
          platforms: linux/amd64
          load: true
          tags: seedling-caddy:check

      - name: Check the image provides what the runtime requires
        run: etc/ci/check-caddy-image.sh seedling-caddy:check

      # A pull request never publishes: it builds the native arch and runs the
      # check above, so a bad Containerfile still fails the pull request, but the
      # image reaches the registry only from the push-to-main run. A released
      # daemon pins CADDY_IMAGE at a `v*` tag, cut by merging the release PR long
      # after this merge, so a release never races the build. The only thing that
      # reads a freshly bumped tag sooner is a daemon built from a `main` checkout
      # by hand (a dev VM); there the pull just retries until the push-to-main
      # build lands, which is not worth publishing an unreviewed image to the real
      # tag from every same-repo branch.
      - name: Assemble tags
        id: tags
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          {
            echo "list<<TAGS"
            echo "$IMAGE:$TAG"
            echo "$IMAGE:latest"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7.3.0
        with:
          context: docker/caddy
          file: docker/caddy/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}

      - name: Attest
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
