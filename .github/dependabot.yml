version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 14
    groups:
      actions-patches:
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /crates/web/frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      deps-patches:
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      deps-patches:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    ignore:
      # rhai 1.26 rejects identifiers beginning with an underscore, which the
      # shipped app definitions rely on. Patch releases of 1.25 still apply.
      - dependency-name: rhai
        versions: [">=1.26"]
