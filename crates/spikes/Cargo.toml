[package]
name = "seedling-spikes"
version.workspace = true
edition.workspace = true
publish = false

# Draft spike harness for the Windows container runtime design
# (docs/plans/windows-spike-containerd.md). Windows-only: on other platforms the
# binary compiles to a stub main explaining it must be run on Windows Server.
# Kept in the workspace so it is format- and clippy-checked everywhere and
# check/test-run on Windows in CI.

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[[bin]]
name = "spike-containerd"
path = "src/bin/spike_containerd.rs"
