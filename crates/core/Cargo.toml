[package]
name = "seedling-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
seedling-bundle = { path = "../bundle" }
seedling-protocol = { path = "../protocol", features = ["rusqlite"] }

arc-swap = "1.9.5"
clap.workspace = true
cronexpr = "1.7.1"
ed25519-dalek.workspace = true
futures-util.workspace = true
ipnet.workspace = true
jiff.workspace = true
libc = "0.2.191"
nftables = { version = "0.6.3", features = ["tokio"] }
nix = { version = "0.31.3", features = ["signal", "term"] }
parking_lot.workspace = true
podman-rest-client = { version = "0.13.0", default-features = false, features = ["uds", "v5"] }
quinn.workspace = true
rand.workspace = true
reqwest.workspace = true
# Held at 1.25.1: from 1.26 a closure that captures `app` cannot be passed to a
# method called on `app` (`app.on_action("x", |rt, _| { ... app ... })`), which fails
# with ErrorDataRace before any script runs, and every BSL script is written
# that way.
rhai = { version = "=1.25.1", features = ["internals", "metadata", "no_time"] }
rtnetlink = "0.24.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
snafu.workspace = true
subtle.workspace = true
systemd = "0.11.1"
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
wildmatch.workspace = true
zbus = { version = "6.2.1", features = ["tokio"] }
zxcvbn = "3.1.1"
whoami.workspace = true
orion = "0.18.1"
secrecy = "0.10.3"
instant-acme = { version = "0.8.5", features = ["time"] }
rcgen = { version = "0.14.10", features = ["aws_lc_rs"] }
pem = "4.0.0"
x509-parser = "0.18.1"
aws-sdk-route53 = { version = "1.135.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = "1.13.2"
aws-credential-types = "1.3.1"
axum.workspace = true
iana-time-zone = "0.1.65"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
bestool-canopy = "0.7.22"
http = "1.5.0"
bytes = "1.12.1"
miette = "7.6.0"
semver = "1.0.28"
base64 = "0.23.1"
oci-client = "0.18.0"
toml.workspace = true
siphasher = "1.0.4"
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }
strum = { version = "0.27.2", features = ["derive"] }
hmac = "0.13.0"
chacha20 = "0.10.2"
libversion = "0.3.3"
blake2 = "0.11.0"
blake3 = "1.8.7"
hex = "0.4.3"
bcrypt = "0.19.3"
argon2.workspace = true
purl = { version = "0.1.6", default-features = false }
url = "2.5.8"
idna = "1.1.0"
percent-encoding = "2.3.2"
regex-automata = "0.4.18"
winnow = "1.0.5"
num-bigint = "0.4.8"
saphyr = "0.3.4"
saphyr-parser = "0.3.4"
hifijson = "0.5.1"

[dev-dependencies]
flate2 = "1.1.11"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
tar = "0.4.46"
tempfile = "3.27.0"
time = "0.3.55"
tokio = { workspace = true, features = ["test-util"] }
