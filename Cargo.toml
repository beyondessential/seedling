[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/daemon", "crates/ctl", "crates/web"]
# cargo-fuzz crate: its own workspace, built only via `cargo fuzz` (nightly +
# sanitizer linkage), never part of `cargo build --workspace`.
exclude = ["crates/protocol/fuzz"]

[workspace.package]
version = "0.13.0"
edition = "2024"
publish = false

[workspace.dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
mime_guess = "2.0.5"
rust-embed = "8.14.0"
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["set-header"] }
wtransport = "0.7.2"
clap = { version = "4.6.7", features = ["derive"] }
if-addrs = "0.15.0"
crossterm = "0.29.0"
dirs = "6.0.0"
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8", "rand_core"] }
futures-util = { version = "0.3.34", default-features = false, features = ["io", "channel"] }
ipnet = "2.12.2"
jiff = { version = "0.2.43", features = ["serde"] }
lloggs = "1.4.0"
parking_lot = { version = "0.12.5", features = ["deadlock_detection"] }
quinn = "0.11.12"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
rfc2047-decoder = "1.1.2"
rustls = "0.23.46"
rustls-pki-types = "1.16.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
sha2 = "0.11.1"
snafu = "0.9.2"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
uuid = { version = "1.29.2", features = ["v4", "serde", "v5"] }
whoami = "2.1.3"
wildmatch = "2.7.0"

[patch.crates-io]
smartstring = { git = "https://github.com/bodil/smartstring", rev = "refs/pull/34/head" }

# Release profile used to build the shipped binaries (deb + tarballs).
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = "symbols"

# Useful when debugging deadlocks, frame-pointers requires nightly
#[profile.dev]
#frame-pointers = "force-on"
#
#[profile.release]
#debug = true
#frame-pointers = "force-on"
